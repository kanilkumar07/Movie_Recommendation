<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Movie Results
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
padding:40px;
overflow-x:hidden;
}

h1{
text-align:center;
font-size:55px;
margin-bottom:50px;
color:red;
}

/* ================= MOVIE CARDS ================= */

.container{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(260px,1fr));
gap:30px;
}

.card{
background:#111827;
border-radius:20px;
overflow:hidden;
text-decoration:none;
color:white;
transition:0.5s;
box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px red;
}

.card img{
width:100%;
height:380px;
object-fit:cover;
}

.card-content{
padding:20px;
}

.card-content h2{
font-size:28px;
margin-bottom:15px;
}

.card-content p{
font-size:16px;
line-height:1.7;
color:#d1d5db;
margin-bottom:10px;
}

.info{
margin-top:15px;
padding-top:15px;
border-top:1px solid #333;
}

.info p{
font-size:15px;
margin-bottom:8px;
color:#f3f4f6;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

body{
padding:20px;
}

h1{
font-size:40px;
}

.card img{
height:320px;
}

}

</style>

</head>

<body>

<h1>
🎬 Recommended Movies
</h1>

<div class="container">

{% for movie in recommendations %}

<a
href="/movie/{{ movie.title }}"
class="card">

<img
src="{{ movie.poster }}"
alt="{{ movie.title }}">

<div class="card-content">

<h2>
{{ movie.title }}
</h2>

<p>
{{ movie.overview[:120] }}...
</p>

<div class="info">

<p>
⭐ Rating :
{{ movie.rating }}
</p>

<p>
📅 Release :
{{ movie.release_date }}
</p>

<p>
🌍 Language :
{{ movie.language }}
</p>

<p>
🔥 Popularity :
{{ movie.popularity }}
</p>

</div>

</div>

</a>

{% endfor %}

</div>

</body>

</html>
