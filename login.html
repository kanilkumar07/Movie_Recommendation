<!DOCTYPE html>
<html>

<head>

<title>
Login
</title>

<style>

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial;
}

form{
background:#1e293b;
padding:40px;
border-radius:15px;
width:350px;
}

h1{
color:white;
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}

a{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}



</style>

</head>

<body>

<form
action="/login_user"
method="POST">

<h1>
Login
</h1>

<input
type="email"
name="email"
placeholder="Email">

<input
type="password"
name="password"
placeholder="Password">

<button type="submit">

Login

</button>

<a href="/register">

Create Account

</a>

</form>

</body>

</html>
