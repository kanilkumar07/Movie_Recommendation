<!DOCTYPE html>
<html>

<head>

<title>
Edit Movie
</title>

<style>

body{
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

form{
background:#1e293b;
padding:40px;
border-radius:15px;
width:500px;
}

h1{
color:red;
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<form
action="/update_movie/{{ movie[0] }}"
method="POST">

<h1>
🎬 Edit Movie
</h1>

<input
type="text"
name="name"
value="{{ movie[1] }}"
required>

<input
type="text"
name="poster"
value="{{ movie[2] }}"
required>

<input
type="text"
name="rating"
value="{{ movie[3] }}"
required>

<input
type="text"
name="year"
value="{{ movie[4] }}"
required>

<input
type="text"
name="trailer"
value="{{ movie[5] }}"
required>

<textarea
name="description"
rows="5"
required>{{ movie[6] }}</textarea>

<button type="submit">

Update Movie

</button>

</form>

</body>

</html>
