<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
{{ movie.title }}
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050816;
color:white;
overflow-x:hidden;
}

/* ================= NAVBAR ================= */

.navbar{
width:100%;
background:#000000d9;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
position:fixed;
top:0;
left:0;
z-index:1000;
backdrop-filter:blur(10px);
}

.logo{
font-size:35px;
font-weight:bold;
color:red;
}

.back-btn{
padding:12px 25px;
background:red;
color:white;
text-decoration:none;
border-radius:10px;
transition:0.4s;
}

.back-btn:hover{
background:#ff0000c7;
}

/* ================= HERO ================= */

.hero{
width:100%;
padding-top:120px;
padding-bottom:80px;
display:flex;
justify-content:center;
}

.container{
width:90%;
max-width:1300px;
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

/* ================= POSTER ================= */

.poster-box img{
width:100%;
border-radius:25px;
box-shadow:0 0 30px rgba(255,0,0,0.3);
}

/* ================= CONTENT ================= */

.content h1{
font-size:65px;
margin-bottom:25px;
}

.content p{
font-size:19px;
line-height:1.9;
color:#d1d5db;
margin-bottom:25px;
}

/* ================= EXTRA INFO ================= */

.extra-info{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:30px;
margin-bottom:30px;
}

.info-box{
background:#111827;
padding:25px;
border-radius:18px;
transition:0.4s;
}

.info-box:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,0,0,0.3);
}

.info-box h3{
margin-bottom:10px;
color:red;
font-size:22px;
}

.info-box p{
font-size:18px;
color:#fff;
}

/* ================= BUTTONS ================= */

.buttons{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
margin-bottom:40px;
}

.btn{
padding:16px 35px;
border:none;
border-radius:12px;
font-size:18px;
font-weight:bold;
text-decoration:none;
transition:0.4s;
}

.watch-btn{
background:red;
color:white;
}

.watch-btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px red;
}

.download-btn{
background:#111827;
border:2px solid red;
color:white;
}

.download-btn:hover{
background:red;
}

/* ================= TRAILER ================= */

.trailer{
margin-top:40px;
}

.trailer h2{
font-size:40px;
margin-bottom:20px;
color:red;
}

iframe{
width:100%;
height:500px;
border:none;
border-radius:20px;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

.container{
grid-template-columns:1fr;
}

.content h1{
font-size:45px;
}

iframe{
height:300px;
}

.extra-info{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

<div class="logo">
MovieAI
</div>

<a href="/" class="back-btn">
← Back Home
</a>

</nav>

<!-- ================= HERO ================= -->

<section class="hero">

<div class="container">

<!-- ================= POSTER ================= -->

<div class="poster-box">

<img
src="{{ movie.poster }}"
alt="{{ movie.title }}">

</div>

<!-- ================= CONTENT ================= -->

<div class="content">

<h1>
{{ movie.title }}
</h1>

<p>
{{ movie.overview }}
</p>

<!-- ================= EXTRA INFO ================= -->

<div class="extra-info">

<div class="info-box">

<h3>
⭐ Rating
</h3>

<p>
{{ movie.rating }}
</p>

</div>

<div class="info-box">

<h3>
📅 Release Date
</h3>

<p>
{{ movie.release_date }}
</p>

</div>

<div class="info-box">

<h3>
🌍 Language
</h3>

<p>
{{ movie.language }}
</p>

</div>

<div class="info-box">

<h3>
🔥 Popularity
</h3>

<p>
{{ movie.popularity }}
</p>

</div>

</div>

<!-- ================= BUTTONS ================= -->

<div class="buttons">

<a
href="{{ movie.trailer }}"
target="_blank"
class="btn watch-btn">

▶ Watch Trailer

</a>

<a
href="{{ movie.trailer }}"
target="_blank"
class="btn download-btn">

⬇ Download Trailer

</a>

</div>

<!-- ================= TRAILER ================= -->

<div class="trailer">

<h2>
🎬 Official Trailer
</h2>

<iframe
src="https://www.youtube.com/embed?listType=search&list={{ movie.title }} official trailer"
allowfullscreen>
</iframe>

</div>

</div>

</div>

</section>

</body>

</html>
