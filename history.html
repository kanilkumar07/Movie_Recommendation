<!DOCTYPE html>
<html>

<head>

<title>
Watch History
</title>

<style>

body{
background:#0f172a;
font-family:Arial;
padding:30px;
color:white;
}

h1{
color:red;
margin-bottom:30px;
}

.movies-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.movie-card{
background:#1e293b;
padding:15px;
border-radius:15px;
transition:0.3s;
}

.movie-card:hover{
transform:translateY(-10px);
box-shadow:0 10px 20px rgba(255,0,0,0.4);
}

.movie-card img{
width:100%;
height:320px;
object-fit:cover;
border-radius:10px;
}

</style>

</head>

<body>

<h1>
🕒 Recently Watched
</h1>

<div class="movies-grid">

{% for movie in history %}

<div class="movie-card">

<img src="{{ movie[3] }}">

<h2>
{{ movie[2] }}
</h2>

<p>
⭐ {{ movie[4] }}
</p>

<p>
📅 {{ movie[5] }}
</p>

</div>

{% endfor %}

</div>

</body>

</html>
