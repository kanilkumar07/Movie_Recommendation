<!DOCTYPE html>
<html>

<head>

<title>
Add Movie
</title>

<style>

body{
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

form{
background:#1e293b;
padding:40px;
border-radius:15px;
width:500px;
}

h1{
color:red;
text-align:center;
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<form
action="/save_movie"
method="POST">

<h1>
🎬 Add Movie
</h1>

<input
type="text"
name="name"
placeholder="Movie Name"
required>

<input
type="text"
name="poster"
placeholder="Poster URL"
required>

<input
type="text"
name="rating"
placeholder="Rating"
required>

<input
type="text"
name="year"
placeholder="Release Year"
required>

<input
type="text"
name="trailer"
placeholder="Trailer URL"
required>

<textarea
name="description"
placeholder="Movie Description"
rows="5"
required></textarea>

<button type="submit">

Add Movie

</button>

</form>

</body>

</html>
