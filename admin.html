<!DOCTYPE html>
<html>

<head>

<title>
Admin Dashboard
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0f172a;
color:white;
padding:30px;
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:40px;
}

h1{
font-size:40px;
color:red;
}

.logout-btn{
padding:12px 20px;
background:red;
color:white;
text-decoration:none;
border-radius:10px;
}

.dashboard{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#1e293b;
padding:30px;
border-radius:15px;
text-align:center;
}

.card h2{
font-size:40px;
margin-bottom:10px;
color:red;
}

.card p{
font-size:20px;
}

</style>

</head>

<body>

<div class="top-bar">

<h1>
🎬 Admin Dashboard
</h1>

<a
href="/add_movie"
class="logout-btn">

Add Movie

</a>

<a
href="/all_users"
class="logout-btn">

Manage Users

</a>

<div style="margin-top:30px;">

<a
href="/all_movies"
class="logout-btn">

Manage Movies

</a>

</div>

<a
href="/logout"
class="logout-btn">

Logout

</a>

</div>

<div class="dashboard">

<div class="card">

<h2>
{{ total_users }}
</h2>

<p>
Total Users
</p>

</div>

<div class="card">

<h2>
{{ total_favorites }}
</h2>

<p>
Favorite Movies
</p>

</div>

</div>

</body>

</html>
