<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
MovieGPT
</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b1120;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* ================= CHAT CONTAINER ================= */

.chat-container{
width:100%;
max-width:1200px;
height:95vh;
background:#111827;
display:flex;
flex-direction:column;
border-radius:25px;
overflow:hidden;
box-shadow:0 0 40px rgba(255,0,0,0.3);
}

/* ================= HEADER ================= */

.chat-header{
background:#dc2626;
padding:22px;
font-size:32px;
font-weight:bold;
color:white;
display:flex;
justify-content:space-between;
align-items:center;
}

.home-btn{
background:white;
color:red;
padding:12px 20px;
border-radius:12px;
text-decoration:none;
font-size:18px;
font-weight:bold;
}

/* ================= CHAT BOX ================= */

.chat-box{
flex:1;
padding:25px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:25px;
background:#0f172a;
}

/* ================= MESSAGE ================= */

.message{
max-width:90%;
padding:20px;
border-radius:18px;
line-height:1.8;
white-space:pre-wrap;
font-size:17px;
animation:fadeIn 0.4s ease;
}

.user{
background:#dc2626;
color:white;
align-self:flex-end;
border-bottom-right-radius:5px;
}

.bot{
background:#1e293b;
color:white;
align-self:flex-start;
border-bottom-left-radius:5px;
}

/* ================= INPUT ================= */

.chat-input{
display:flex;
padding:20px;
background:#111827;
gap:15px;
}

.chat-input input{
flex:1;
padding:18px;
border:none;
outline:none;
border-radius:14px;
font-size:17px;
background:#1e293b;
color:white;
}

.chat-input button{
padding:18px 35px;
border:none;
background:#dc2626;
color:white;
font-size:17px;
border-radius:14px;
cursor:pointer;
transition:0.4s;
}

.chat-input button:hover{
background:red;
}

/* ================= TYPING ================= */

.typing{
background:#1e293b;
padding:15px 20px;
border-radius:15px;
width:fit-content;
display:none;
margin-left:20px;
margin-bottom:20px;
}

.typing span{
display:inline-block;
width:10px;
height:10px;
margin:0 3px;
background:white;
border-radius:50%;
animation:bounce 1s infinite;
}

.typing span:nth-child(2){
animation-delay:0.2s;
}

.typing span:nth-child(3){
animation-delay:0.4s;
}

@keyframes bounce{

0%,80%,100%{
transform:scale(0);
}

40%{
transform:scale(1);
}

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(10px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* ================= MOVIE CARDS ================= */

.movie-container{
display:flex;
gap:20px;
flex-wrap:wrap;
margin-top:20px;
}

.movie-card{
background:#0f172a;
padding:15px;
border-radius:15px;
width:200px;
transition:0.4s;
}

.movie-card:hover{
transform:scale(1.05);
}

.movie-card img{
width:100%;
height:280px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

.movie-card h3{
font-size:20px;
margin-bottom:10px;
}

.movie-card p{
margin:5px 0;
font-size:15px;
}

.movie-card a{
display:inline-block;
margin-top:12px;
padding:10px 15px;
background:#dc2626;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

.chat-container{
height:100vh;
border-radius:0;
}

.chat-header{
font-size:24px;
padding:18px;
}

.home-btn{
font-size:15px;
padding:10px 15px;
}

.message{
max-width:95%;
font-size:15px;
}

.chat-input{
padding:15px;
}

.chat-input input{
font-size:15px;
padding:15px;
}

.chat-input button{
padding:15px 20px;
font-size:15px;
}

.movie-container{
justify-content:center;
}

.movie-card{
width:160px;
}

.movie-card img{
height:220px;
}

}

</style>

</head>

<body>

<div class="chat-container">

<!-- ================= HEADER ================= -->

<div class="chat-header">

🤖 MovieGPT

<a href="/home" class="home-btn">
Home
</a>

</div>

<!-- ================= CHAT BOX ================= -->

<div
class="chat-box"
id="chatBox">

<div class="message bot">

👋 Hello! I am MovieGPT.

Ask me:

🔥 Action movies  
😂 Comedy movies  
👻 Horror movies  
🚀 Sci-fi movies  
❤️ Romantic movies  
📺 Web series

</div>

</div>

<!-- ================= TYPING ================= -->

<div
class="typing"
id="typing">

<span></span>
<span></span>
<span></span>

</div>

<!-- ================= INPUT ================= -->

<div class="chat-input">

<input
type="text"
id="userInput"
placeholder="Ask MovieGPT...">

<button onclick="sendMessage()">
Send
</button>

</div>

</div>

<script>

function sendMessage(){

let input =
document.getElementById(
"userInput"
);

let message = input.value;

if(message.trim() === ""){
return;
}

let chatBox =
document.getElementById(
"chatBox"
);

chatBox.innerHTML += `

<div class="message user">
${message}
</div>

`;

input.value = "";

chatBox.scrollTop =
chatBox.scrollHeight;

document
.getElementById(
"typing"
)
.style.display = "block";

fetch("/get_chat",{

method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:
"message=" +
encodeURIComponent(message)

})

.then(response =>
response.json()
)

.then(data => {

document
.getElementById(
"typing"
)
.style.display = "none";

let movieCards = "";

data.movies.forEach(movie => {

movieCards += `

<div class="movie-card">

<img src="${movie.poster}">

<h3>${movie.name}</h3>

<p>⭐ Rating: ${movie.rating}</p>

<p>📅 Year: ${movie.year}</p>

<a href="${movie.trailer}" target="_blank">

▶ Watch Trailer

</a>

</div>

`;

});

chatBox.innerHTML += `

<div class="message bot">

${data.text}

<div class="movie-container">

${movieCards}

</div>

</div>

`;

chatBox.scrollTop =
chatBox.scrollHeight;

});

}

</script>

</body>

</html>
